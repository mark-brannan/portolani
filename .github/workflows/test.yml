name: test
on:
  push: { branches: [main] }
  pull_request:

# The tests run pull-request-authored code. Nothing here needs to write to the
# repository, and the checkout's token should not outlive the step.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      # No install step: portolani has no dependencies, and the tests must
      # pass with the network unavailable.
      - run: npm test

  # Separate from `test` because this one needs the network -- it fetches
  # Natural Earth data, same as the Pages deploy does. Runs on pull_request
  # so the 100 KB budget gate and the build itself are exercised before
  # merge, not first on a live-page failure after it.
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build:demo
