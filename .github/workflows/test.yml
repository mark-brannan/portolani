name: test
on:
  push: { branches: [main] }
  pull_request:

# The tests run pull-request-authored code. Nothing here needs to write to the
# repository, and the checkout's token should not outlive the step.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      # No install step: portolani has no dependencies, and the tests must
      # pass with the network unavailable.
      - run: npm test

  # Separate from `test` because this one needs the network -- it fetches
  # Natural Earth data, same as the Pages deploy does. Runs on pull_request
  # so the 100 KB budget gate and the build itself are exercised before
  # merge, not first on a live-page failure after it.
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build:demo

  # The single required status check. Everything else fans in here, so the
  # ruleset requires one context and adding or renaming a matrix leg does not
  # silently change what is required. `always()` is what lets it evaluate when
  # a dependency failed or was skipped, so the gate reports an explicit pass or
  # fail of its own. Without it the gate would inherit the skip, and a skipped
  # required check is not a dependable block: a job skipped by `if` reports
  # `skipped`, while a whole workflow skipped by path or branch filters leaves
  # the check pending forever. Neither is the verdict a ruleset needs.
  # No `name:` here, deliberately: the reported context is the job id.
  ci-gate:
    # It reads nothing and writes nothing; the results come from `needs`.
    permissions: {}
    needs: [test, build-demo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}"
          echo "build-demo: ${{ needs.build-demo.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build-demo.result }}" != "success" ]; then
            exit 1
          fi
