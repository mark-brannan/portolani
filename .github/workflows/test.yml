name: test
on:
  push: { branches: [main] }
  pull_request:

# The tests run pull-request-authored code. Nothing here needs to write to the
# repository, and the checkout's token should not outlive the step.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      # The tests must pass with the network unavailable.
      - run: npm ci
      - run: npm test

  # Separate from `test` because this one needs the network -- it fetches
  # Natural Earth data, same as the Pages deploy does. Runs on pull_request
  # so the build is exercised before merge, not first on a live-page failure.
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm ci
      # keyed on the sha256 pins alone, so an edit elsewhere in the script keeps the cache
      - id: pins
        run: echo "hash=$(grep -oE '[0-9a-f]{64}' scripts/build-preview.mjs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with: { path: downloads, key: "downloads-${{ steps.pins.outputs.hash }}" }
      - run: npm run build:preview
      # the page under touch emulation at phone widths (test/touch.test.mjs); needs the built _site/
      - run: npx playwright-core install chromium-headless-shell
      - run: node --test test/touch.test.mjs
        env: { TOUCH_REQUIRED: '1' }

  # Refuses to call an empty PR green: a branch whose tree equals its base at
  # the merge base (a stray commit reverted it) merges cleanly and lands
  # nothing. Listed in ci-gate's needs, so it needs no ruleset entry.
  nonempty:
    # The reusable workflow checks out the repo to diff against base, so it
    # needs contents: read -- the least it can be granted and still run.
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # A measurement, not a gate, so it stays out of ci-gate's needs. Writes the
  # sticky PR comment, hence pull-requests: write.
  complexity:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/complexity.yml@main

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  ci-gate:
    needs: [test, build-preview, nonempty]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
