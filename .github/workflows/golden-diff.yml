name: golden-diff

# Old versus new for the goldens a pull request regenerates: scripts/golden-diff.mjs writes
# old/new/diff images to out/golden-diff, uploaded as the `golden-diff` artifact, and a table of
# what moved to the job summary. A reusable workflow so it can be called from a deploy-time
# pipeline as well as from test.yml. A measurement, not a gate.
on:
  workflow_call:
    inputs:
      base-ref: { type: string, default: origin/main }

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm ci
      - run: node scripts/golden-diff.mjs "${{ inputs.base-ref }}"
      - uses: actions/upload-artifact@v5
        with: { name: golden-diff, path: out/golden-diff, if-no-files-found: ignore }
