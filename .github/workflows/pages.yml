name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm ci
      # Fetches the pinned Natural Earth release once and fails if the
      # assembled site exceeds the 100 KB budget the page itself claims.
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job actually publishes, so only this job gets the write
    # scopes -- the build job that runs untrusted-ish PR-shaped code (npm ci,
    # a network fetch) never needs them.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
