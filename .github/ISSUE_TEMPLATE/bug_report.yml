name: Bug report
description: The map drew something wrong, or a script failed
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through a
        [private advisory](https://github.com/mark-brannan/portolani/security/advisories/new)
        instead; please don't file them here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Where on the map (place, zoom) and which settings. A screenshot helps.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser or Node version, and platform
      placeholder: 'Firefox 140 on Android, or Node v22.11.0 on macOS arm64'
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The console text or stack trace, if it failed rather than drew something wrong.
      render: text
    validations:
      required: false
