<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 60" width="440" height="240">
<!-- Avignon on Jorge de Aguiar's 1492 chart: the papal palace as a long red block seen a little from above,
     two round towers at the right, pale window slots and a pale walkway band along the top.
     Traced from the crop at docs/towns-aguiar/town-aguiar-avignon.raw.png (1 unit = 1 crop pixel). -->
<g stroke="#2a1d12" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
 <!-- red block, tilted as on the sheet -->
 <path d="M12 35 L86 9 Q92 8 94 14 L100 40 L100 60 L21 60 Z" fill="#c8432b"/>
 <!-- pale walkway band under the top edge -->
 <path d="M26 50 L77 31 L79 35 L28 54 Z" fill="#fff" fill-opacity=".8" stroke-width="1"/>
 <!-- upper window slot -->
 <g transform="rotate(-19 38 38)">
  <rect x="29" y="33" width="18" height="10" rx="1.5" fill="#fff"/>
  <rect x="33" y="36" width="4" height="4" fill="#2a1d12" stroke="none"/>
  <rect x="39" y="36" width="4" height="4" fill="#2a1d12" stroke="none"/>
 </g>
 <!-- lower band line and lower window slot (cut by the crop) -->
 <path d="M27 54 L84 37" fill="none"/>
 <g transform="rotate(-19 42 56)">
  <rect x="33" y="51" width="18" height="10" rx="1.5" fill="#fff"/>
  <rect x="37" y="54" width="4" height="4" fill="#2a1d12" stroke="none"/>
 </g>
 <!-- round towers: pale tops with a dark centre -->
 <circle cx="82" cy="27" r="7.5" fill="#fff"/>
 <circle cx="82.5" cy="27" r="2" fill="#2a1d12" stroke="none"/>
 <path d="M80 60 L80 51 Q87 40 94 51 L94 60 Z" fill="#fff"/>
 <circle cx="87.5" cy="50" r="2" fill="#2a1d12" stroke="none"/>
</g>
</svg>
