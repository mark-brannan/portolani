<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 107 102" width="428" height="408">
<!-- Jerusalem on Jorge de Aguiar's 1492 chart: an ink-only walled compound, tall keep at left,
     domed church in the middle, square tower behind, round tower at right, gate arches along the foot.
     Traced from the crop at docs/towns-aguiar/town-aguiar-jerusalem.raw.png (1 unit = 1 crop pixel). -->
<g fill="#fff" stroke="#2a1d12" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
 <!-- curtain wall: shaded top surface then white front -->
 <path d="M30 58 L72 58 L78 72 L30 72 Z" fill="#2a1d12" fill-opacity=".18"/>
 <path d="M30 72 Q52 69 78 72 L80 98 L30 98 Z"/>
 <!-- domed church -->
 <path d="M41 56 L41 50 Q52 30 64 50 L64 56 Z"/>
 <path d="M48 58 L48 48 Q52 42 56 48 L56 58" fill="none"/>
 <path d="M52 50 L52 55 M50 36 L52 29 L54 36" fill="none"/>
 <rect x="40" y="56" width="26" height="3"/>
 <!-- tall square tower behind -->
 <path d="M70 62 L70 22 Q76 16 82 22 L82 62 Z"/>
 <path d="M78 24 L78 60" fill="none" stroke-opacity=".5"/>
 <rect x="73" y="35" width="5" height="9" fill="#2a1d12" fill-opacity=".6"/>
 <rect x="74" y="48" width="2" height="4" fill="#2a1d12"/>
 <!-- keep: narrow upper tower with shaded side, small turret, wide lower block -->
 <path d="M33 31 Q38 32 42 37 L42 56 L33 59 Z" fill="#2a1d12" fill-opacity=".3"/>
 <path d="M21 60 L21 34 Q27 27 33 31 L33 60 Z"/>
 <path d="M32 30 L32 18" fill="none"/>
 <path d="M8 57 L8 50 Q14 41 20 50 L20 57 Z"/>
 <path d="M11 55 L30 55 L30 100 L9 100 Z"/>
 <path d="M11 59 L30 59" fill="none"/>
 <path d="M13 100 L13 91 Q16 86 19 91 L19 100" fill="#2a1d12" fill-opacity=".6"/>
 <circle cx="18" cy="72" r="1" fill="#2a1d12"/><circle cx="23" cy="72" r="1" fill="#2a1d12"/>
 <!-- round tower at right -->
 <path d="M83 60 L83 56 Q92 42 101 56 L101 60 Z"/>
 <path d="M83 58 L83 100 L102 100 L102 58 Z"/>
 <path d="M83 62 L102 62" fill="none"/>
 <path d="M85 100 L85 92 Q87.5 88 90 92 L90 100" fill="#2a1d12" fill-opacity=".6"/>
 <circle cx="86" cy="73" r="1" fill="#2a1d12"/><circle cx="90" cy="73" r="1" fill="#2a1d12"/>
 <!-- gate arches and loopholes along the foot of the curtain wall -->
 <path d="M50 98 L50 91 Q54 86 58 91 L58 98" fill="#2a1d12" fill-opacity=".6"/>
 <path d="M36 80 L38 85 M66 83 L67 88" fill="none"/>
 <!-- ground line -->
 <path d="M0 98 L107 98" stroke-width="1.8" fill="none"/>
</g>
</svg>
