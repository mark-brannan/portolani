  <g fill="#ffffff"><path d="M59,98v-3h3v3M66,98v-3h3v3M73,98v-3h3v3M82,100v-3h3v3M90,100v-3h3v3M78,110v-3h3v3M85,110v-3h3v3M92,110v-3h3v3M102,110v-3h3v3M109,110v-3h3v3M116,110v-3h3v3M123,110v-3h3v3M130,110v-3h3v3M137,110v-3h3v3M144,110v-3h3v3M153,100v-3h3v3M160,100v-3h3v3M167,100v-3h3v3M174,100v-3h3v3"/></g>
  <!-- gate -->
  <rect x="109" y="115" width="4" height="7" fill="#2a1d12"/>
 </g>
</svg>
