<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 80" width="416" height="320">
<!-- Walled lakeside town from Jorge de Aguiar's 1492 chart: round crenellated curtain wall, gate tower at right, cluster of towers with red roofs and domes. Traced from the crop at docs/towns-aguiar/town-aguiar-lake.raw.png (pixel = user unit). -->
<g stroke="#2a1d12" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
<!-- back towers -->
<rect x="46" y="0" width="12" height="18" fill="#fff"/>
<rect x="55" y="2" width="3" height="16" fill="#3f5fa8" opacity=".3" stroke="none"/>
<rect x="29" y="13" width="12" height="28" fill="#fff"/>
<path d="M29 14Q35 2 41 14Z" fill="#c8432b"/>
<path d="M34 2v4" fill="none"/>
<rect x="37" y="15" width="4" height="25" fill="#3f5fa8" opacity=".3" stroke="none"/>
<!-- left pair under one skewed roof -->
<path d="M20 30L20 19 29 18 29 29Z" fill="#c8432b"/>
<path d="M10 31L11 23 22 21 21 30Z" fill="#c8432b"/>
<rect x="10" y="30" width="20" height="11" fill="#fff"/>
<path d="M20 30v11" fill="none"/>
<rect x="15" y="34" width="2.5" height="3" fill="#2a1d12" stroke="none"/>
<!-- small roofed house centre -->
<path d="M41 24L41 18 51 17 51 23Z" fill="#c8432b"/>
<rect x="41" y="23" width="10" height="17" fill="#fff"/>
<rect x="43.5" y="27" width="2" height="2.5" fill="#2a1d12" stroke="none"/>
<rect x="47.5" y="27" width="2" height="2.5" fill="#2a1d12" stroke="none"/>
<!-- big hall right -->
<path d="M61 22L65 12 78 11 80 21Z" fill="#c8432b"/>
<rect x="62" y="21" width="18" height="17" fill="#fff"/>
<rect x="70" y="25" width="2.5" height="3" fill="#2a1d12" stroke="none"/>
<rect x="75" y="25" width="2.5" height="3" fill="#2a1d12" stroke="none"/>
<!-- right tower -->
<rect x="82" y="19" width="10" height="14" fill="#fff"/>
<rect x="86" y="24" width="2.5" height="3" fill="#2a1d12" stroke="none"/>
<!-- inner parapet with merlons -->
<path d="M12 40H62" fill="none"/>
<path d="M22 37h3v3h-3zM28 37h3v3h-3zM34 37h3v3h-3zM40 37h3v3h-3zM46 37h3v3h-3z" fill="#2a1d12" stroke="none"/>
<!-- curtain wall band -->
<path d="M8 40C14 45 25 48 45 48S80 40 93 31L95 33C94 44 86 54 70 62S30 70 15 60C10 55 9 48 8 40Z" fill="#fff"/>
<ellipse cx="17" cy="53" rx="6" ry="9" fill="#c8432b" opacity=".3" stroke="none"/>
<path d="M20 46v5M30 48v5M40 48v5M50 48v5M62 46v5M73 42v5" fill="none"/>
<rect x="29" y="57" width="3" height="3" fill="#2a1d12" stroke="none"/>
<rect x="51" y="58" width="3" height="3" fill="#2a1d12" stroke="none"/>
<rect x="73" y="52" width="3" height="3" fill="#2a1d12" stroke="none"/>
<!-- fore tower cutting the wall-walk -->
<rect x="50" y="30" width="10" height="16" fill="#fff"/>
<rect x="53.5" y="35" width="2.5" height="3" fill="#2a1d12" stroke="none"/>
<!-- gate tower at right -->
<path d="M88 50V36A5 5 0 0 1 98 36V50Z" fill="#c8432b" opacity=".5"/>
<path d="M88 50V36A5 5 0 0 1 98 36V50" fill="none" stroke-width="1.6"/>
</g>
</svg>
