  <g fill="#3b2a1a"><rect x="140" y="395" width="12" height="7"/><rect x="178" y="403" width="12" height="7"/><rect x="208" y="410" width="12" height="7"/><rect x="238" y="414" width="12" height="7"/><rect x="268" y="410" width="12" height="7"/></g>
  <path d="M305 385Q322 372 345 378Q372 392 374 420Q370 448 345 452Q315 452 306 425Z" fill="#3a2a20" stroke="#1d140d" stroke-width="1.5"/>
