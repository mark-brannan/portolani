      <path d="M232 150L120 300M268 150L300 300M243 12L228 150M243 12L270 150"/>
    </g>
    <!-- ratlines between the shrouds -->
    <rect x="130" y="160" width="90" height="200" fill="url(#ratlines)" clip-path="url(#fore-shrouds)"/>
    <rect x="200" y="140" width="100" height="230" fill="url(#ratlines)" clip-path="url(#main-shrouds)"/>
    <g stroke="#3b2a1a" stroke-width="0.9">
      <path d="M152 168L140 345M190 168L205 340M232 150L205 360M268 150L290 345"/>
    </g>
