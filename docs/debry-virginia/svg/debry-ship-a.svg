      <path d="M37 90L290 280" stroke-width="7"/>
      <path d="M355 52L155 305" stroke-width="7"/>
      <path d="M367 160L290 330" stroke-width="5"/>
      <path d="M65 215L130 340" stroke-width="7"/>
      <path d="M410 245L345 300" stroke-width="7"/>
    </g>
    <path d="M95 305Q86 298 93 313" stroke="#6b3f1f" stroke-width="3"/>
  </g>
  <!-- tops -->
  <path d="M152 156H190L186 169H156Z" fill="#d9b45a" stroke="#3b2a1a" stroke-width="1"/>
  <path d="M229 135H270L266 151H233Z" fill="#d9b45a" stroke="#3b2a1a" stroke-width="1"/>
