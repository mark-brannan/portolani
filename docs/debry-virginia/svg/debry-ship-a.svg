<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470">
  <!-- debry-ship-a traced over docs/debry-virginia/debry-ship-a.raw.png: viewBox = the crop's pixel size -->
  <defs>
    <pattern id="ratlines" width="8" height="7" patternUnits="userSpaceOnUse"><path d="M0 3.5H8" stroke="#3b2a1a" stroke-width="0.7"/></pattern>
