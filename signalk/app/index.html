<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portolani</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1913; overflow: hidden; font-family: "IM Fell English", Georgia, serif; }
  #stage { position: absolute; inset: 0 48px 0 0; overflow: hidden; touch-action: none; cursor: grab; }
  #stage canvas { position: absolute; left: 0; bottom: 0; width: 100%; aspect-ratio: 1600 / 1000; }
  #gutter { position: absolute; top: 0; right: 0; bottom: 0; width: 48px; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; align-items: center; }
  #gutter button { width: 36px; height: 36px; border: 1px solid #8a7350; border-radius: 6px; background: #e9d8b4; color: #3b2a1a; cursor: pointer; padding: 0; }
  #gutter button[aria-pressed="true"] { background: #c9ad7a; }
  #follow path { fill: none; }
  #follow[aria-pressed="true"] path { fill: currentColor; }
  #needle { transform-origin: 10px 10px; }
  #compass { touch-action: none; }
  #bare .shut { display: none; }
  #bare[aria-pressed="true"] .shut { display: inline; }
  #gutter[data-bare] > button:not(#bare), #gutter > button[hidden], body[data-bare] #status { display: none; }
  #stage canvas { transform-origin: 0 0; }
  #drawer { position: absolute; top: 12px; right: 56px; width: 240px; max-height: calc(100% - 24px); overflow-y: auto; box-sizing: border-box; background: #e9d8b4; color: #3b2a1a; border: 1px solid #8a7350; border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 16px #0008; }
  #drawer[hidden] { display: none; }
  #drawer h2 { font-size: 15px; margin: 0 0 8px; font-weight: normal; letter-spacing: 1px; }
  .chip { display: flex; align-items: center; gap: 8px; border: 1px solid #8a7350; border-radius: 16px; padding: 4px 10px 4px 4px; background: #f3e7cc; cursor: pointer; user-select: none; }
  .chip[aria-pressed="false"] { opacity: 0.55; background: transparent; }
  .chip svg { flex: none; border-radius: 12px; background: #e9d8b4; }
  #drawer .chip + .chip { margin-top: 6px; }
  #drawer h3 { font-size: 13px; margin: 10px 0 6px; font-weight: normal; font-style: italic; }
  #drawer .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #drawer .row .chip { margin: 0; padding: 2px 8px 2px 2px; gap: 4px; font-size: 13px; }
  .chip .glyph { width: 30px; height: 24px; display: grid; place-items: center; border-radius: 12px; background: #e9d8b4; }
  .chip img { width: 30px; height: 24px; object-fit: contain; border-radius: 12px; background: #e9d8b4; }
  #tile { position: absolute; background: #f3e7cc; color: #3b2a1a; border: 1px solid #8a7350; border-radius: 6px; padding: 6px 10px; box-shadow: 0 2px 8px #0006; pointer-events: none; }
  #tile[hidden] { display: none; }
  #tile b { display: block; font-weight: normal; font-size: 15px; }
  #tile span { font-size: 12px; font-style: italic; }
  #status { position: absolute; left: 8px; top: 6px; color: #c9ad7a; font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="map" width="1600" height="1000"></canvas><canvas id="marks" width="1600" height="1000"></canvas></div>
<div id="gutter">
  <button id="bare" title="Hide the toolbars" aria-label="Hide the toolbars" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 10q8-9 16 0-8 9-16 0Z"/><circle cx="10" cy="10" r="2.6"/><path class="shut" d="M3.5 16.5 16.5 3.5"/></svg></button>
  <button id="layers" title="Layers" aria-label="Layers" aria-pressed="false" aria-controls="drawer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 2 7l8 4 8-4-8-4ZM2 11l8 4 8-4"/></svg></button>
  <button id="follow" title="Follow the vessel" aria-label="Follow the vessel" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 2 15 17 10 13.5 5 17Z"/></svg></button>
  <button id="rotl" title="Turn the chart counter-clockwise" aria-label="Turn the chart counter-clockwise"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 10a6 6 0 1 0 2-4.5"/><path d="M5.5 2.5v3.5H9"/></svg></button>
  <button id="compass" title="North up: click to lock, drag round to turn" aria-label="North up: click to lock, drag round to turn" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.2"/><g id="needle"><path d="M10 3l2.4 7h-4.8Z" fill="#8c2f1e"/><path d="M10 17l2.4-7h-4.8Z" fill="none" stroke="currentColor" stroke-width="1"/></g></svg></button>
  <button id="rotr" title="Turn the chart clockwise" aria-label="Turn the chart clockwise"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M14.5 2.5v3.5H11"/></svg></button>
  <button id="constrain" title="Constrain the zoom to the cells" aria-label="Constrain the zoom to the cells" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l4.5 4.5M7.5 4v3.5H4M17 3l-4.5 4.5M12.5 4v3.5H16M3 17l4.5-4.5M7.5 16v-3.5H4M17 17l-4.5-4.5M12.5 16v-3.5H16"/></svg></button>
  <button id="fullscreen" title="Go fullscreen" aria-label="Go fullscreen" aria-pressed="false" hidden><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5"/></svg></button>
</div>
<div id="drawer" hidden>
  <h2>Layers</h2>
  <div class="chip" id="depth" role="switch" tabindex="0" aria-pressed="true" title="The sea's depth: shoals washed, contours dotted, soundings and hazards">
    <svg width="44" height="24" viewBox="0 0 44 24"><path d="M0 24V14q10-6 22-2t22-4v16Z" fill="#2f4a5a" fill-opacity=".12"/><path d="M0 14q10-6 22-2t22-4" stroke="#2f4a5a" stroke-width="1.2" stroke-dasharray="0.1 3" stroke-linecap="round" fill="none"/><text x="11" y="21" font-size="8" font-style="italic" fill="#3b2a1a">4</text><text x="28" y="21" font-size="8" font-style="italic" fill="#3b2a1a">12</text><path d="M33 4h4M35 2v4" stroke="#3b2a1a" stroke-width=".8"/></svg>
    <span>Depth</span>
  </div>
  <div class="chip" id="mountains" role="switch" tabindex="0" aria-pressed="true" title="The mountain ranges in ink, after Tolkien's 1937 pen">
    <svg width="44" height="24" viewBox="0 0 28 18" color="#3b2a1a"><path d="M2 17 8 6l2 4 5-9 5 9 2-3 5 10Z" fill="#e9d8b4" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M15 1l1.5 16M16 4l3.5 6.5M16.2 7l2.6 5M16.5 10l2.2 4M8 6l1 11M22 7l1.3 4" stroke="currentColor" stroke-width=".7" fill="none"/></svg>
    <span>Mountains</span>
  </div>
  <div class="chip" id="peaks" role="switch" tabindex="0" aria-pressed="true" title="Named summits, lettered; a tap gives the height">
    <svg width="44" height="24" viewBox="0 0 28 18" color="#3b2a1a" id="peak-glyph"></svg>
    <span>Landmark peaks</span>
  </div>
  <div class="chip" id="cartouche" role="switch" tabindex="0" aria-pressed="false" title="The de Wit cartouche, the chart's title, in the top right corner">
    <img alt="">
    <span>Cartouche</span>
  </div>
  <h3>Roses</h3><div class="row" id="roses" role="radiogroup" aria-label="Roses"></div>
  <h3>Towns</h3><div class="row" id="towns" aria-label="Towns"></div>
  <h3>Monsters</h3><div class="row" id="monsters" role="radiogroup" aria-label="Monsters"></div>
</div>
<div id="tile" hidden><b></b><span></span></div>
<div id="status"></div>
<script type="importmap">{ "imports": { "coast-wright": "./coast-wright/index.js", "coastlines/catalogue.json": "./coastlines/catalogue.json", "coastlines/provider": "./enc-provider.js", "coastlines/world-provider": "./coastlines/lib/provider.js", "portolani/": "./scripts/" } }</script>
<script type="module" src="app.js"></script>
</body>
</html>
