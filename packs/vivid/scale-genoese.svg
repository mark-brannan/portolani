<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 100" width="1120" height="200">
  <!-- After the scale of miles on Genoese and Catalan portolans: a framed bar whose border runs
       with vermilion chevrons between verdigris lozenges; inside, five major divisions in
       vermilion, each ringed at its foot, with ink dots for the minor ones. White ground for
       the renderer's `multiply`. -->
  <defs>
    <path id="chev" d="M0,0 L14,0 L24,7 L14,14 L0,14 L10,7 Z" fill="#d8432a"/>
    <path id="loz" d="M0,7 L9,1 L18,7 L9,13 Z" fill="#4f9a5a"/>
    <g id="motif"><use xlink:href="#chev"/><use xlink:href="#loz" x="30"/></g>
    <g id="dots" fill="#2a1d12"><circle cx="20" cy="50" r="1.6"/><circle cx="40" cy="50" r="1.6"/><circle cx="60" cy="50" r="1.6"/><circle cx="80" cy="50" r="1.6"/></g>
  </defs>
  <g stroke="#2a1d12" stroke-width="1.2">
    <!-- border bands -->
    <g stroke-width="0.8" stroke="#7a1d0f">
      <g transform="translate(14,6)">
        <use xlink:href="#motif"/><use xlink:href="#motif" x="54"/><use xlink:href="#motif" x="108"/><use xlink:href="#motif" x="162"/><use xlink:href="#motif" x="216"/>
        <use xlink:href="#motif" x="270"/><use xlink:href="#motif" x="324"/><use xlink:href="#motif" x="378"/><use xlink:href="#motif" x="432"/><use xlink:href="#chev" x="486"/>
      </g>
      <g transform="translate(14,80)">
        <use xlink:href="#motif"/><use xlink:href="#motif" x="54"/><use xlink:href="#motif" x="108"/><use xlink:href="#motif" x="162"/><use xlink:href="#motif" x="216"/>
        <use xlink:href="#motif" x="270"/><use xlink:href="#motif" x="324"/><use xlink:href="#motif" x="378"/><use xlink:href="#motif" x="432"/><use xlink:href="#chev" x="486"/>
      </g>
    </g>
    <!-- end caps, verdigris -->
    <rect x="2" y="2" width="10" height="96" fill="#4f9a5a"/>
    <rect x="548" y="2" width="10" height="96" fill="#4f9a5a"/>
    <!-- frame -->
    <g fill="none">
      <rect x="2" y="2" width="556" height="96" stroke-width="2.4"/>
      <rect x="12" y="24" width="536" height="52"/>
    </g>
    <!-- five divisions of 100 units each, dots at the fifths -->
    <g transform="translate(12,0)">
      <g stroke="#c0392b" stroke-width="2">
        <path d="M107.2,24V76M214.4,24V76M321.6,24V76M428.8,24V76"/>
      </g>
      <g fill="#ffffff" stroke="#c0392b" stroke-width="1.8">
        <circle cx="107.2" cy="50" r="4.5"/><circle cx="214.4" cy="50" r="4.5"/><circle cx="321.6" cy="50" r="4.5"/><circle cx="428.8" cy="50" r="4.5"/>
      </g>
      <g stroke="none">
        <use xlink:href="#dots" transform="scale(1.072,1)"/><use xlink:href="#dots" transform="translate(107.2,0) scale(1.072,1)"/><use xlink:href="#dots" transform="translate(214.4,0) scale(1.072,1)"/>
        <use xlink:href="#dots" transform="translate(321.6,0) scale(1.072,1)"/><use xlink:href="#dots" transform="translate(428.8,0) scale(1.072,1)"/>
      </g>
    </g>
  </g>
</svg>
