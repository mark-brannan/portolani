<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128" width="320" height="256">
  <!-- After a town vignette on Jorge de Aguiar's chart, 1492 (Beinecke Library, Yale): a walled
       town in a lapis halo, a curtain wall with a gate, towers and red roofs behind. Drawn, not
       traced; transparent ground, for the renderer's `multiply`. -->
  <g stroke="#2a1d12" stroke-width="1.3" stroke-linejoin="round">
    <!-- the halo -->
    <ellipse cx="80" cy="66" rx="74" ry="56" fill="#5a62b8" fill-opacity="0.28" stroke="#36408a" stroke-width="5" stroke-opacity="0.7"/>
    <ellipse cx="80" cy="66" rx="66" ry="48" fill="#ffffff" stroke="none"/>
    <!-- houses behind the wall: white walls, vermilion roofs -->
    <g fill="#ffffff">
      <rect x="40" y="56" width="16" height="18"/><rect x="60" y="50" width="14" height="24"/>
      <rect x="92" y="52" width="16" height="22"/><rect x="110" y="58" width="14" height="16"/>
    </g>
    <g fill="#d8432a">
      <path d="M38,56 L48,46 L58,56 Z"/><path d="M58,50 L67,40 L76,50 Z"/>
      <path d="M90,52 L100,42 L110,52 Z"/><path d="M108,58 L117,49 L126,58 Z"/>
    </g>
    <!-- the keep: a tall tower with merlons and a gilt-tipped pennant -->
    <path d="M74,74 L74,26 L72,26 L72,18 L76,18 L76,22 L79,22 L79,18 L83,18 L83,22 L86,22 L86,18 L90,18 L90,26 L88,26 L88,74 Z" fill="#ffffff"/>
    <path d="M78,34 L78,28 Q81,25 84,28 L84,34 Z M78,46 L78,42 L84,42 L84,46 Z" fill="#2a1d12" stroke="none"/>
    <path d="M81,18 L81,6" fill="none"/>
    <path d="M81,6 L94,9 L81,12 Z" fill="#d8432a"/>
    <!-- the curtain wall, curving with the halo, crenellated, a gate in the middle -->
    <path d="M24,74 Q80,64 136,74 L136,96 Q80,88 24,96 Z" fill="#ffffff"/>
    <path d="M24,74 l0,-5 l6,0 l0,4 l7,-1 l0,-5 l6,0 l0,4 l7,-1 l0,-5 l6,0 l0,4 l7,-1 l0,-5 l6,0 l0,4 l6,0 l0,-5 l6,0 l0,5 l7,1 l0,-4 l6,0 l0,5 l7,1 l0,-4 l6,0 l0,5 l7,1 l0,-4 l6,0 l0,5" fill="#ffffff"/>
    <path d="M73,92 L73,82 Q80,74 87,82 L87,92" fill="#2a1d12"/>
    <!-- flanking towers, round, with vermilion cones -->
    <rect x="18" y="66" width="12" height="32" fill="#ffffff"/>
    <path d="M16,66 L24,52 L32,66 Z" fill="#d8432a"/>
    <rect x="130" y="66" width="12" height="32" fill="#ffffff"/>
    <path d="M128,66 L136,52 L144,66 Z" fill="#d8432a"/>
    <!-- ashlar courses on the wall -->
    <path d="M30,84 Q80,76 130,84 M30,90 Q80,82 130,90" fill="none" stroke-width="0.6"/>
    <!-- ground line, verdigris -->
    <path d="M14,102 Q80,90 146,102" fill="none" stroke="#3f8a4a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
