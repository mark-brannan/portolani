<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -64 120 116" width="240" height="232">
  <!-- After the ships on Abraham Ortelius's Maris Pacifici, 1589 (via Wikimedia Commons,
       File:Ortelius_-_Maris_Pacifici_1589.jpg), drawn as the lateen-rigged caravel of the Iberian
       voyages: a small round-sterned hull heading right, three masts each with a lateen sail on a
       raked yard, the mainsail charged with a vermilion cross, gilt pennants at the peaks. Drawn,
       not traced; white ground where the paper shows, for the renderer's `multiply`. -->
  <g stroke="#2a1d12" stroke-linejoin="round" stroke-linecap="round">
    
    <path d="M-28,34 L-28,-24" fill="none" stroke-width="2.2"/>
    <path d="M-50,-34 Q-26,-20 -14,-2 Q-22,11 -46,12 Q-52,-7 -50,-34 Z" fill="#ffffff" stroke-width="1.8"/>
    
    <path d="M-53,-35 L-11,-1" fill="none" stroke-width="2.2"/>
    <path d="M-50,-34 l-2,-6 l-14,2 l8,2 l-6,3 Z" fill="#c9a13b" stroke-width="1"/>
    
    <path d="M4,34 L4,-44" fill="none" stroke-width="2.2"/>
    <path d="M-26,-54 Q7,-32 28,-6 Q13,10 -18,14 Q-26,-16 -26,-54 Z" fill="#ffffff" stroke-width="1.8"/>
    <path d="M-5.333333333333333,-24.333333333333336 l0,18 M-13.333333333333332,-15.333333333333334 l16,0" fill="none" stroke="#b5452a" stroke-width="3.6" stroke-linecap="butt"/>
    <path d="M-29,-55 L31,-5" fill="none" stroke-width="2.2"/>
    <path d="M-26,-54 l-2,-6 l-14,2 l8,2 l-6,3 Z" fill="#c9a13b" stroke-width="1"/>
    
    <path d="M30,34 L30,-20" fill="none" stroke-width="2.2"/>
    <path d="M14,-30 Q37,-15 48,4 Q41,15 18,14 Q12,-4 14,-30 Z" fill="#ffffff" stroke-width="1.8"/>
    
    <path d="M11,-31 L51,5" fill="none" stroke-width="2.2"/>
    <path d="M14,-30 l-2,-6 l-14,2 l8,2 l-6,3 Z" fill="#c9a13b" stroke-width="1"/>
    <!-- the hull -->
    <path d="M-54,12 L-40,16 L40,16 L52,10 C50,26 38,36 16,38 L-34,38 C-48,36 -54,26 -54,12 Z" fill="#ffffff" stroke-width="2.2"/>
    <path d="M-53,22 C-30,27 20,27 50,18 M-50,30 C-30,33 20,33 44,26" fill="none" stroke-width="1"/>
    <path d="M-54,12 L-54,4 L-40,6 L-40,16" fill="#ffffff" stroke-width="1.6"/>
    <path d="M-30,20 h3 M-20,20 h3 M-10,20 h3 M0,20 h3 M10,20 h3 M20,20 h3" fill="none" stroke-width="1.8"/>
    <!-- the sea -->
    <path d="M-58,44 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0" fill="none" stroke="#3f8a4a" stroke-width="2"/>
  </g>
</svg>
