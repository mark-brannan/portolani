<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -60 180 112" width="360" height="224">
  <!-- After the war galleys rowing in to Candia in a 17th-century print of the siege (British
       Museum 1882,0211.86, via Wikimedia Commons), drawn in the idiom of the 16th-century charts:
       a Mediterranean galley heading right, a bank of oars, one great lateen sail on a long yard,
       a striped awning over the poop, a beak at the bow, gilt pennants. Drawn, not traced; white
       ground where the paper shows, for the renderer's `multiply`. -->
  <g stroke="#2a1d12" stroke-linejoin="round" stroke-linecap="round">
    <!-- the oars, under the hull -->
    <path d="M-42.0,14 L-54.0,38 M-35.4,14 L-47.4,38 M-28.8,14 L-40.8,38 M-22.2,14 L-34.2,38 M-15.6,14 L-27.6,38 M-9.0,14 L-21.0,38 M-2.4,14 L-14.4,38 M4.2,14 L-7.8,38 M10.8,14 L-1.2,38 M17.4,14 L5.4,38 M24.0,14 L12.0,38 M30.6,14 L18.6,38 M37.2,14 L25.2,38 M43.8,14 L31.8,38 M50.4,14 L38.4,38" fill="none" stroke-width="1.4"/>
    <path d="M-54.0,38 l-3,4 M-47.4,38 l-3,4 M-40.8,38 l-3,4 M-34.2,38 l-3,4 M-27.6,38 l-3,4 M-21.0,38 l-3,4 M-14.4,38 l-3,4 M-7.8,38 l-3,4 M-1.2,38 l-3,4 M5.4,38 l-3,4 M12.0,38 l-3,4 M18.6,38 l-3,4 M25.2,38 l-3,4 M31.8,38 l-3,4 M38.4,38 l-3,4" fill="none" stroke-width="2.6"/>
    <!-- mast, yard and the lateen sail, bellied forward -->
    <path d="M0,12 L0,-44" fill="none" stroke-width="2.4"/>
    <path d="M-62,-52 Q-10,-30 60,-2 Q40,6 18,8 Q-20,8 -34,4 Q-56,-22 -62,-52 Z" fill="#ffffff" stroke-width="2"/>
    <path d="M-44,-38 Q-36,-14 -26,4 M-26,-30 Q-18,-10 -10,6 M-8,-22 Q0,-6 6,7 M10,-15 Q16,-4 22,7 M28,-9 Q32,-2 36,5" fill="none" stroke-width="0.8"/>
    <path d="M-66,-54 L64,-2" fill="none" stroke-width="2.4"/>
    <path d="M0,-44 L0,-50 L16,-47 L8,-46 L14,-43 L0,-44 M-66,-54 L-80,-50 L-72,-50 L-78,-46 L-64,-52" fill="#c9a13b" stroke-width="1.1"/>
    <!-- the hull: long and low, a beak forward, the poop raised aft -->
    <path d="M-82,4 L-48,8 L60,8 L72,4 L90,2 L72,12 C66,20 50,24 30,24 L-60,24 C-74,22 -82,14 -82,4 Z" fill="#ffffff" stroke-width="2.2"/>
    <path d="M-80,12 C-60,16 40,16 70,10 M-76,18 C-56,21 40,21 64,16" fill="none" stroke-width="1"/>
    <path d="M-44,12 L56,12" fill="none" stroke="#b5452a" stroke-width="2.2"/>
    <!-- the poop and its awning -->
    <path d="M-80,6 L-80,-6 Q-66,-14 -50,-6 L-48,6" fill="none" stroke-width="1.6"/>
    <path d="M-76,6 L-76,-4 Q-73,-9 -70,-8 L-70,6 Z" fill="#b5452a"/>
    <path d="M-70,6 L-70,-4 Q-67,-9 -64,-8 L-64,6 Z" fill="#ffffff"/>
    <path d="M-64,6 L-64,-4 Q-61,-9 -58,-8 L-58,6 Z" fill="#b5452a"/>
    <path d="M-58,6 L-58,-4 Q-55,-9 -52,-8 L-52,6 Z" fill="#ffffff"/>
    <path d="M-52,6 L-52,-4 Q-49,-9 -46,-8 L-46,6 Z" fill="#b5452a"/>
    <path d="M-80,6 L-80,-4 Q-66,-14 -50,-6 L-50,6" fill="none" stroke-width="1.8"/>
    <path d="M-86,4 L-90,-6 M-86,4 L-84,-8" fill="none" stroke-width="1.6"/>
    <!-- the sea -->
    <path d="M-88,46 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0 q6,-5 12,0 q6,5 12,0" fill="none" stroke="#3f8a4a" stroke-width="2"/>
  </g>
</svg>
