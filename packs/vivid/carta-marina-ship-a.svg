<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -79 104 158" width="208" height="316">
  <!-- After the English carrack (L) on Olaus Magnus's Carta Marina, 1539 (James Ford Bell Library,
       via Wikimedia Commons, File:Carta_Marina.jpeg): a high-charged carrack heading right, a tall
       sterncastle banded in verdigris, the main course set with a vermilion cross, a lateen mizzen,
       a gilt pennant at the masthead. Drawn, not traced; white ground where the paper shows, for
       the renderer's `multiply`. -->
  <g stroke="#2a1d12" stroke-linejoin="round" stroke-linecap="round">
    <!-- rigging first, under the sails -->
    <path d="M4,-66 L-44,22 M4,-66 L44,24 M4,-40 L-30,22 M4,-40 L30,24 M-22,-30 L-44,18 M30,-34 L50,14" fill="none" stroke-width="0.8"/>
    <!-- masts -->
    <path d="M4,30 L4,-70 M-22,28 L-22,-36 M30,28 L30,-38 M40,16 L54,-6" fill="none" stroke-width="2.6"/>
    <!-- lateen mizzen -->
    <path d="M-40,-8 L-8,-52 M-34,-16 Q-24,-22 -10,-48 Q-16,-30 -30,-6 Z" fill="#ffffff" stroke-width="1.8"/>
    <!-- main course, bellied, with a cross -->
    <path d="M-16,-50 L24,-50 Q30,-28 24,-6 L-16,-6 Q-22,-28 -16,-50 Z" fill="#ffffff" stroke-width="2.2"/>
    <path d="M4,-48 L4,-8 M-17,-28 L25,-28" fill="none" stroke="#b5452a" stroke-width="4" stroke-linecap="butt"/>
    <path d="M-20,-52 L28,-52" fill="none" stroke-width="2.4"/>
    <!-- main topsail -->
    <path d="M-6,-68 L14,-68 Q17,-62 14,-56 L-6,-56 Q-9,-62 -6,-68 Z" fill="#ffffff" stroke-width="1.8"/>
    <!-- foresail -->
    <path d="M20,-34 L40,-34 Q44,-20 40,-8 L20,-8 Q17,-20 20,-34 Z" fill="#ffffff" stroke-width="1.8"/>
    <path d="M23,-30 Q20,-20 23,-10 M28,-31 Q26,-20 28,-10 M34,-31 Q34,-20 34,-10" fill="none" stroke-width="0.8"/>
    <path d="M-12,-46 Q-16,-28 -12,-10 M-6,-47 Q-8,-28 -6,-9 M12,-47 Q14,-28 12,-9 M18,-47 Q22,-28 18,-9" fill="none" stroke-width="0.8"/>
    <!-- the masthead pennant, gilt -->
    <path d="M4,-70 L4,-76 L24,-73 L14,-72 L22,-69 L4,-70" fill="#c9a13b" stroke-width="1.3"/>
    <!-- fighting top -->
    <path d="M-1,-56 L9,-56 L8,-52 L0,-52 Z" fill="#ffffff" stroke-width="1.6"/>
    <!-- the hull: a high sterncastle aft (left), the waist, a forecastle forward -->
    <path d="M-48,0 L-26,2 L-24,22 L28,22 L32,10 L48,8 L46,24 C44,40 30,52 6,54 L-24,54 C-38,52 -46,40 -48,24 Z" fill="#ffffff" stroke-width="2.4"/>
    <path d="M-47,6 L-25,8 L-25,18 L-47,16 Z" fill="#8fbf93" stroke-width="1.2"/>
    <path d="M-47,30 C-30,34 20,34 46,28 L45,36 C20,42 -30,42 -46,38 Z" fill="#8fbf93" stroke-width="1.4"/>
    <path d="M-42,46 C-20,50 20,50 38,44 M-24,22 L-24,30 M28,22 L32,28 M33,12 L47,11" fill="none" stroke-width="1"/>
    <path d="M-18,26 h4 M-8,26 h4 M2,26 h4 M12,26 h4" fill="none" stroke-width="2"/>
    <!-- the sea, verdigris -->
    <path d="M-50,60 q6,-6 12,0 q6,6 12,0 q6,-6 12,0 q6,6 12,0 q6,-6 12,0 q6,6 12,0 q6,-6 12,0 q6,6 12,0 M-36,70 q6,-6 12,0 q6,6 12,0 M14,70 q6,-6 12,0 q6,6 12,0" fill="none" stroke="#3f8a4a" stroke-width="2"/>
  </g>
</svg>
