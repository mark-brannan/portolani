<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-160 -160 320 320" width="320" height="320">
  <!-- After the roses of the anonymous Dieppe portolan atlas of 1547 (Huntington Library HM 29; Commons:
       Europe and northern Africa. HM 29). Drawn, not traced: lapis cardinals with white lights, verdigris
       intercardinals and half-winds, cream petals on a solid vermilion ground, a large gilt boss in a beaded
       ring, a string of beads off the ring at the east and a gilt fleur-de-lis outside it at the north. The
       original chart is south-up; this is drawn north-up. White ground for the renderer's `multiply`. -->
  <defs>
    <path id="cL" d="M0,-128 L-13.5,-50.2 L0,-0 Z"/>
    <path id="cR" d="M0,-128 L13.5,-50.2 L0,-0 Z"/>
    <path id="dL" d="M0,-112 L-10.3,-53 L0,-0 Z"/>
    <path id="dR" d="M0,-112 L10.3,-53 L0,-0 Z"/>
    <path id="hL" d="M0,-96 L-6.1,-57.7 L0,-0 Z"/>
    <path id="hR" d="M0,-96 L6.1,-57.7 L0,-0 Z"/>
    <!-- cream petal on the red ground -->
    <path id="petal" d="M0,-112 Q7,-86 0,-58 Q-7,-86 0,-112 Z"/>
    <g id="cL"><use xlink:href="#cL" fill="#5b80c2"/><use xlink:href="#cR" fill="#1f3a72"/></g>
    <g id="dGr"><use xlink:href="#dL" fill="#5fa868"/><use xlink:href="#dR" fill="#2f6b3a"/></g>
    <g id="hGr"><use xlink:href="#hL" fill="#a9c48e"/><use xlink:href="#hR" fill="#5d8a3a"/></g>
  </defs>
  <g stroke="#2a1d12" stroke-width="1.1" stroke-linejoin="round">
    <g transform="scale(0.88)">
    <!-- double ring round a vermilion ground -->
    <circle r="126" fill="none" stroke-width="1.2"/>
    <circle r="120" fill="#ffffff" stroke-width="1.2"/>
    <circle r="116" fill="#cc4a2c" stroke-width="0.8"/>
    <g fill="#efd9a8" stroke-width="0.9">
    <use xlink:href="#petal" transform="rotate(11.25)"/><use xlink:href="#petal" transform="rotate(33.75)"/><use xlink:href="#petal" transform="rotate(56.25)"/><use xlink:href="#petal" transform="rotate(78.75)"/>
    <use xlink:href="#petal" transform="rotate(101.25)"/><use xlink:href="#petal" transform="rotate(123.75)"/><use xlink:href="#petal" transform="rotate(146.25)"/><use xlink:href="#petal" transform="rotate(168.75)"/>
    <use xlink:href="#petal" transform="rotate(191.25)"/><use xlink:href="#petal" transform="rotate(213.75)"/><use xlink:href="#petal" transform="rotate(236.25)"/><use xlink:href="#petal" transform="rotate(258.75)"/>
    <use xlink:href="#petal" transform="rotate(281.25)"/><use xlink:href="#petal" transform="rotate(303.75)"/><use xlink:href="#petal" transform="rotate(326.25)"/><use xlink:href="#petal" transform="rotate(348.75)"/>
    </g>
    <!-- half-winds pale green -->
    <use xlink:href="#hGr" transform="rotate(22.5)"/><use xlink:href="#hGr" transform="rotate(67.5)"/><use xlink:href="#hGr" transform="rotate(112.5)"/><use xlink:href="#hGr" transform="rotate(157.5)"/>
    <use xlink:href="#hGr" transform="rotate(202.5)"/><use xlink:href="#hGr" transform="rotate(247.5)"/><use xlink:href="#hGr" transform="rotate(292.5)"/><use xlink:href="#hGr" transform="rotate(337.5)"/>
    <!-- intercardinals verdigris, cardinals lapis with white lights -->
    <use xlink:href="#dGr" transform="rotate(45)"/><use xlink:href="#dGr" transform="rotate(135)"/><use xlink:href="#dGr" transform="rotate(225)"/><use xlink:href="#dGr" transform="rotate(315)"/>
    <use xlink:href="#cL"/><use xlink:href="#cL" transform="rotate(90)"/><use xlink:href="#cL" transform="rotate(180)"/><use xlink:href="#cL" transform="rotate(270)"/>
    <g fill="#ffffff" stroke="none"><circle cx="-4.8" cy="-91.9" r="4"/><circle cx="91.9" cy="-4.8" r="4"/><circle cx="4.8" cy="91.9" r="4"/><circle cx="-91.9" cy="4.8" r="4"/></g>
    <!-- large gilt boss in a white beaded ring -->
    <circle r="60" fill="#ffffff" stroke-width="1.2"/>
    <g fill="#d8432a" stroke="none"><circle cx="0" cy="-56" r="1.5"/><circle cx="14.5" cy="-54.1" r="1.5"/><circle cx="28" cy="-48.5" r="1.5"/><circle cx="39.6" cy="-39.6" r="1.5"/><circle cx="48.5" cy="-28" r="1.5"/><circle cx="54.1" cy="-14.5" r="1.5"/><circle cx="56" cy="0" r="1.5"/><circle cx="54.1" cy="14.5" r="1.5"/><circle cx="48.5" cy="28" r="1.5"/><circle cx="39.6" cy="39.6" r="1.5"/><circle cx="28" cy="48.5" r="1.5"/><circle cx="14.5" cy="54.1" r="1.5"/><circle cx="0" cy="56" r="1.5"/><circle cx="-14.5" cy="54.1" r="1.5"/><circle cx="-28" cy="48.5" r="1.5"/><circle cx="-39.6" cy="39.6" r="1.5"/><circle cx="-48.5" cy="28" r="1.5"/><circle cx="-54.1" cy="14.5" r="1.5"/><circle cx="-56" cy="0" r="1.5"/><circle cx="-54.1" cy="-14.5" r="1.5"/><circle cx="-48.5" cy="-28" r="1.5"/><circle cx="-39.6" cy="-39.6" r="1.5"/><circle cx="-28" cy="-48.5" r="1.5"/><circle cx="-14.5" cy="-54.1" r="1.5"/></g>
    <circle r="51" fill="#c9a13b" stroke-width="1.2"/>
    <path stroke="#b08a32" stroke-width="1" d="M0,-8L0,-44M3.1,-7.4L16.8,-40.7M5.7,-5.7L31.1,-31.1M7.4,-3.1L40.7,-16.8M8,0L44,0M7.4,3.1L40.7,16.8M5.7,5.7L31.1,31.1M3.1,7.4L16.8,40.7M0,8L0,44M-3.1,7.4L-16.8,40.7M-5.7,5.7L-31.1,31.1M-7.4,3.1L-40.7,16.8M-8,0L-44,0M-7.4,-3.1L-40.7,-16.8M-5.7,-5.7L-31.1,-31.1M-3.1,-7.4L-16.8,-40.7"/>
    <circle r="5" fill="#b08a32" stroke="none"/>
    </g>
    <!-- east: a string of beads off the ring -->
    <g fill="#c9a13b" stroke-width="1.2">
    <path d="M110.9,0 H156" fill="none"/>
    <circle cx="124" r="5.6"/><circle cx="140" r="5"/>
    </g>
    <!-- north: a gilt fleur-de-lis outside the ring -->
    <g transform="translate(0,-108.9) scale(0.56)" fill="#c9a13b" stroke-width="2">
    <path d="M0,-80 C8,-68 13,-54 7,-38 L-7,-38 C-13,-54 -8,-68 0,-80 Z M6,-30 C10,-50 26,-62 34,-52 C40,-44 34,-32 26,-34 C31,-38 30,-46 24,-46 C16,-46 12,-34 12,-26 Z M-6,-30 C-10,-50 -26,-62 -34,-52 C-40,-44 -34,-32 -26,-34 C-31,-38 -30,-46 -24,-46 C-16,-46 -12,-34 -12,-26 Z M-7,-38 L7,-38 L12,-26 L-12,-26 Z M-6,-18 L6,-18 L3,-4 L0,0 L-3,-4 Z M5,-18 C14,-16 20,-10 16,-2 C14,-8 10,-12 4,-12 Z M-5,-18 C-14,-16 -20,-10 -16,-2 C-14,-8 -10,-12 -4,-12 Z"/>
    </g>
  </g>
</svg>
