<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-160 -160 320 320" width="320" height="320">
  <!-- After the small roses of Salvator Oliva's portolan atlas, Marseille 1619 (Huntington HM 2515).
       Drawn, not traced, and simplified to read at 110 px: gilt cardinals, blue intercardinals, green
       half-winds, a red-and-blue circle, eight gilt roundels and a blue fleur-de-lis for the north. -->
