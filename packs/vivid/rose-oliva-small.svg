    <use xlink:href="#cG" transform="rotate(90)"/><use xlink:href="#cG" transform="rotate(180)"/><use xlink:href="#cG" transform="rotate(270)"/>
    <circle r="66" fill="#ffffff" stroke-width="2.4"/>
    <use xlink:href="#roundel" transform="rotate(22.5)"/><use xlink:href="#roundel" transform="rotate(67.5)"/><use xlink:href="#roundel" transform="rotate(112.5)"/><use xlink:href="#roundel" transform="rotate(157.5)"/>
    <use xlink:href="#roundel" transform="rotate(202.5)"/><use xlink:href="#roundel" transform="rotate(247.5)"/><use xlink:href="#roundel" transform="rotate(292.5)"/><use xlink:href="#roundel" transform="rotate(337.5)"/>
